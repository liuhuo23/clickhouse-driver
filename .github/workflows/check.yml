name: Check and Test
on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded PR runs so a force-push doesn't pile up runners.
# Tag/push-to-master runs do not cancel-in-progress.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compile / lint / unit-test on ubuntu + macOS.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/_check.yml
    with:
      os: ${{ matrix.os }}

  # Integration tests against multiple ClickHouse versions.
  integration:
    strategy:
      fail-fast: false
      matrix:
        clickhouse-image:
          - clickhouse/clickhouse-server:24.8
          - clickhouse/clickhouse-server:latest
    uses: ./.github/workflows/_integration.yml
    with:
      clickhouse-image: ${{ matrix.clickhouse-image }}