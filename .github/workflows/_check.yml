name: _check

on:
  workflow_call:
    inputs:
      os:
        type: string
        default: 'ubuntu-latest'

jobs:
  check:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-moonbit

      - name: moon check
        run: moon check --target native

      # `-p <root>` does not include subpackages, so run both explicitly.
      - name: moon test (unit, HTTP driver)
        run: moon test -p liuhuo23/clickhouse-driver --target native

      - name: moon test (unit, native driver)
        run: moon test -p liuhuo23/clickhouse-driver/native --target native

      - name: lint
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
