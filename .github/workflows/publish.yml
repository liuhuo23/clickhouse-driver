name: Publish Package
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

# Don't cancel in-progress publish runs — they are tag-driven and
# finishing one is cheap; cancellation here can leave partial state.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/_check.yml

  integration:
    uses: ./.github/workflows/_integration.yml

  publish:
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-moonbit

      # moon publish uses the version field in moon.mod; the git tag must match it.
      - name: verify tag matches moon.mod version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          MOD_VERSION=$(grep -E '^version[[:space:]]*=' moon.mod | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          [ "$TAG_VERSION" = "$MOD_VERSION" ] || {
            echo "Error: tag '$TAG' != moon.mod '$MOD_VERSION'"
            exit 1
          }
          echo "Version OK: $TAG_VERSION"

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          [ -n "$SECRET" ] || { echo "MOONCAKES_MOONBIT_COMMUNITY_TOKEN not set"; exit 1; }
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json