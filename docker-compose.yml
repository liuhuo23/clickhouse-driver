services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "39000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: barn
      CLICKHOUSE_DB: default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20